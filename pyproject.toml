[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copula"
version = "0.1.0.dev0"
description = "Sound sharing of stochastic samples across reruns, edits and comparisons of agent programs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Bowen-Sun-0728/Copula"
Documentation = "https://bowen-sun-0728.github.io/Copula/"
Issues = "https://github.com/Bowen-Sun-0728/Copula/issues"

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.30"]
dspy = ["dspy>=3.0"]
test = ["pytest>=7"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
copula = "copula.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copula = ["_shim/*.py", "_shim/node/*.js", "kernel/PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
