name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit and end-to-end tests (mock model)
        run: PYTHONPATH=src:. python -m unittest discover -s tests -t . -v
      - name: client tests and documentation examples (openai, anthropic)
        run: |
          python -m pip install openai anthropic
          PYTHONPATH=src:. COPULA_ANTHROPIC_PYTHON=$(which python) python -m unittest -v tests.test_copula_clients tests.test_docs
      - name: build and install
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          cd /tmp && copula --help
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the documentation site
        run: |
          python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
          mkdocs build --strict
      # pushes the site to the gh-pages branch; GitHub Pages serves it once Settings > Pages
      # deploys from that branch
      - name: publish the site (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --no-history
